[project]
name = "bplus-research-toolkit"
version = "0.1.0"
description = "Multimodal experiment acquisition, quality-control, analysis, and reporting toolkit"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jinja2>=3.1"]

[project.optional-dependencies]
analysis = ["mne>=1.6", "mne-nirs>=0.6", "neurokit2>=0.2", "pymovements>=0.12", "pandas", "numpy", "scipy"]
# needed only for the CURRY-native (.cdt) EEG path (MNE >= 1.11 requires it)
curry = ["curryreader>=0.1.2"]
acquisition = ["psychopy>=2024.1", "pylsl>=1.16"]
dev = ["pytest>=8", "ruff"]
seetapsych = ["seetapsych-lib[webui]>=0.0.3.post2", "seetapsych-attributes>=0.0.3.post1", "seetapsych-configs", "opencv-python>=4.10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
